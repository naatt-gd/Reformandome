.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.mini-char{width:54px;height:62px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--txt);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:2px}.mini-char .character-art{width:100%;height:100%}.mini-char small{position:absolute;font-size:11px;right:-4px;bottom:-4px;background:#171326;border-radius:50%;padding:2px}.hero-character{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#302641,#1c1928);border:1px solid #59466f;border-radius:18px;padding:16px;margin-bottom:13px}.avatar-large{width:132px;height:176px;border-radius:18px;background:linear-gradient(160deg,#57436d,#211b30);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:7px}.avatar-large .character-art{width:100%;height:100%}.avatar-large .weapon{position:absolute;right:2px;bottom:4px;font-size:25px;background:#171326dd;border-radius:50%;padding:3px}.hero-info h2{margin:0 0 5px}.hero-info p{margin:3px 0}.coin{color:#ffd479;font-weight:800}.equipment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}.item .item-icon{font-size:27px}.item p{margin:4px 0;font-size:12px}.item button{width:100%;margin-top:5px}.item.equipped{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}.character-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.character-fields label{margin:7px 0 4px}.section-note{font-size:12px;color:var(--muted)}@media(max-width:420px){.avatar-large{width:112px;height:158px}.equipment-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer{position:fixed;bottom:0;width:100%;padding:10px;background:#171326;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}
</style></head><body>

const qs=[

]],

]],

]],
['8. Seguimiento y estilo','La mejor planificación es la que puedes sostener.',[

['style','Estilo de acompañamiento',['Cercano y motivador','Directo y práctico','Videojuego con niveles/misiones','Mezcla']],
['pace','Ritmo de progresión',['Muy gradual','Moderado','Retos progresivos, sin perder seguridad']],
['rewards','¿Qué recompensas te motivan?',['Logros y niveles','Monedas virtuales','Ocio planificado','Estadísticas y rachas','No necesito recompensas']],

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const gear=[
{id:'sword_wood',name:'Espada de madera',slot:'weapon',icon:'🗡️',cost:0,level:1,desc:'Tu primera arma de aventura.'},
{id:'bow_basic',name:'Arco del bosque',slot:'weapon',icon:'🏹',cost:18,level:2,desc:'Precisión y paciencia.'},
{id:'staff_moon',name:'Bastón lunar',slot:'weapon',icon:'🪄',cost:35,level:4,desc:'Un toque mágico.'},
{id:'daggers',name:'Dagas gemelas',slot:'weapon',icon:'⚔️',cost:50,level:6,desc:'Agilidad y decisión.'},
{id:'armor_traveler',name:'Atuendo aventurero',slot:'armor',icon:'🥋',cost:0,level:1,desc:'Ropa cómoda para empezar.'},
{id:'armor_emerald',name:'Armadura esmeralda',slot:'armor',icon:'🛡️',cost:28,level:3,desc:'Una nueva apariencia.'},
{id:'armor_royal',name:'Armadura real',slot:'armor',icon:'👑',cost:65,level:7,desc:'Un conjunto digno de leyenda.'},
{id:'boots_basic',name:'Botas de viaje',slot:'boots',icon:'🥾',cost:0,level:1,desc:'Un paso cada vez.'},
{id:'boots_wing',name:'Botas aladas',slot:'boots',icon:'👢',cost:24,level:3,desc:'Para tus grandes avances.'},
{id:'amulet',name:'Amuleto de constancia',slot:'accessory',icon:'📿',cost:20,level:2,desc:'Un recordatorio de tu compromiso.'},
{id:'crown',name:'Corona de campeona',slot:'accessory',icon:'👑',cost:75,level:8,desc:'Se gana con constancia.'}
];
function level(){return Math.floor((d.xp||0)/100)+1}
function characterArt(){let c=d.character||characterBlank,skin={clara:'#f5d7c4',media:'#d9a985',morena:'#b97850',oscura:'#75452f'}[c.skin]||'#d9a985',hair={castaño:'#68402f',negro:'#211a1b',rubio:'#d8b45f',pelirrojo:'#a84e32'}[c.hairColor]||'#68402f',armor=c.equipped.armor==='armor_emerald'?'#287b65':c.equipped.armor==='armor_royal'?'#b78b42':'#66517d',boots=c.equipped.boots==='boots_wing'?'#d9d6e8':'#342b3e',female=c.gender!=='hombre',hairShape=c.hair==='corto'?'M35 31 Q36 8 55 9 Q76 9 76 31 L70 27 Q57 20 42 29 Z':c.hair==='liso'?'M34 29 Q32 7 55 8 Q78 8 76 31 L74 59 L67 48 L66 29 Q53 20 42 29 L40 51 L34 58 Z':'M33 30 Q27 9 43 8 Q49 1 59 8 Q77 5 78 27 L74 52 Q68 46 68 32 Q55 20 42 31 L39 51 L32 55 Z';return `<div class="character-art"><svg viewBox="0 0 110 180" role="img" aria-label="Personaje de cuerpo completo" xmlns="http://www.w3.org/2000/svg"><ellipse cx="55" cy="171" rx="31" ry="5" fill="#0b0910" opacity=".45"/><path d="M42 111 L39 151 L35 166 L48 166 L55 127 L62 166 L76 166 L70 150 L68 111Z" fill="${armor}" stroke="#21192d" stroke-width="2"/><path d="M34 160 L49 160 L49 171 L31 171 Q27 167 34 160 M62 160 L77 160 L82 171 L61 171Z" fill="${boots}" stroke="#21192d" stroke-width="2"/><path d="M39 53 Q25 54 24 75 L18 111 Q17 118 24 119 Q30 119 32 111 L40 82 L43 111 L67 111 L70 82 L78 111 Q81 120 87 117 Q93 114 89 105 L81 68 Q77 54 68 53Z" fill="${skin}" stroke="#5c3e3c" stroke-width="1.5"/><path d="M39 52 Q55 43 70 52 L76 105 Q56 118 34 105Z" fill="${armor}" stroke="#21192d" stroke-width="2"/><path d="M45 57 L55 69 L65 57" fill="none" stroke="#d8c5ed" stroke-width="3"/><path d="M47 103 L55 94 L63 103" fill="none" stroke="#d8c5ed" stroke-width="2"/><rect x="49" y="39" width="12" height="15" rx="5" fill="${skin}"/><circle cx="55" cy="27" r="19" fill="${skin}" stroke="#5c3e3c" stroke-width="1.5"/><path d="${hairShape}" fill="${hair}" stroke="#35232b" stroke-width="1.5"/><circle cx="48" cy="29" r="1.7" fill="#30212a"/><circle cx="62" cy="29" r="1.7" fill="#30212a"/><path d="M50 37 Q55 40 60 37" fill="none" stroke="#8f514d" stroke-width="1.5" stroke-linecap="round"/><path d="M24 72 L12 102 Q9 109 15 112 Q21 114 24 106 L35 82 M78 82 L88 105 Q91 113 97 110 Q102 107 98 99 L83 70" fill="none" stroke="${skin}" stroke-width="8" stroke-linecap="round"/><path d="M17 105 L12 118 M94 104 L99 117" stroke="${skin}" stroke-width="6" stroke-linecap="round"/><path d="M34 108 L76 108" stroke="#d9c5ed" stroke-width="2"/><circle cx="55" cy="81" r="4" fill="#e6c879"/></svg></div>`}
function characterSmall(){let c=d.character||characterBlank,w=gear.find(x=>x.id===c.equipped.weapon);return `${characterArt()}<small>${w?w.icon:'✨'}</small>`}
function characterCard(){let c=d.character,weapon=gear.find(x=>x.id===c.equipped.weapon),owned=c.owned||[];return `<div class="hero-character"><div class="avatar-large">${characterArt()}<span class="weapon">${weapon?weapon.icon:'✨'}</span></div><div class="hero-info"><h2>${esc(c.name||'Mi héroe')}</h2><p>Nivel ${level()} · ${d.xp} XP</p><div class="progress"><span style="width:${d.xp%100}%"></span></div><p class="coin">🪙 ${d.coins} monedas</p><p class="small">${owned.length} objetos desbloqueados</p></div></div>`}
function characterProfile(){let c=d.character,owned=c.owned||[];return `${characterCard()}<section class="card"><h2>Personaliza tu personaje</h2><p>Elige quién te acompaña en esta aventura. Puedes cambiar su aspecto cuando quieras.</p><div class="character-fields"><div><label>Nombre</label><input id="charName" maxlength="20" value="${esc(c.name)}" placeholder="Nombre"></div><div><label>Personaje</label><select id="charGender"><option value="mujer" ${c.gender==='mujer'?'selected':''}>Mujer</option><option value="hombre" ${c.gender==='hombre'?'selected':''}>Hombre</option></select></div><div><label>Tono de piel</label><select id="charSkin">${[['clara','Claro'],['media','Medio'],['morena','Moreno'],['oscura','Oscuro']].map(([v,l])=>`<option value="${v}" ${c.skin===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Peinado</label><select id="charHair">${[['rizado','Rizado'],['liso','Liso'],['corto','Corto'],['rojo','Ondulado rojizo'],['rubio','Claro']].map(([v,l])=>`<option value="${v}" ${c.hair===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Color de pelo</label><select id="charHairColor">${[['castaño','Castaño'],['negro','Negro'],['rubio','Rubio'],['pelirrojo','Pelirrojo']].map(([v,l])=>`<option value="${v}" ${c.hairColor===v?'selected':''}>${l}</option>`).join('')}</select></div></div><button class="primary" onclick="saveCharacter()">Guardar apariencia</button></section><section class="card"><h2>Tu equipo</h2><div class="grid"><div class="stat"><b>${(gear.find(x=>x.id===c.equipped.weapon)||{}).icon||'—'}</b><span>Arma</span></div><div class="stat"><b>${(gear.find(x=>x.id===c.equipped.armor)||{}).icon||'—'}</b><span>Armadura</span></div><div class="stat"><b>${(gear.find(x=>x.id===c.equipped.boots)||{}).icon||'—'}</b><span>Botas</span></div><div class="stat"><b>${(gear.find(x=>x.id===c.equipped.accessory)||{}).icon||'—'}</b><span>Accesorio</span></div></div><p class="section-note">El equipo es visual: no modifica tus objetivos ni te exige entrenar más.</p></section><section class="card"><h2>Armería y tienda</h2><p>Consigue objetos con las monedas de tus misiones. Algunos se desbloquean al subir de nivel.</p><div class="equipment-grid">${gear.map(g=>{let has=owned.includes(g.id),eq=c.equipped[g.slot]===g.id,locked=level()<g.level;return `<div class="item ${eq?'equipped':''}"><div class="item-icon">${g.icon}</div><b>${g.name}</b><p>${g.desc}</p><p>${locked?`🔒 Nivel ${g.level}`:has?(eq?'✓ Equipado':'Desbloqueado'):`🪙 ${g.cost}`}</p>${locked?`<button class="secondary" disabled>Bloqueado</button>`:has?`<button class="${eq?'secondary':'primary'}" onclick="equip('${g.id}')">${eq?'Equipado':'Equipar'}</button>`:`<button class="primary" onclick="buyGear('${g.id}')" ${d.coins<g.cost?'disabled':''}>Comprar · ${g.cost} 🪙</button>`}</div>`}).join('')}</div></section>`}
function saveCharacter(){let c=d.character;c.name=document.querySelector('#charName').value.trim()||'Mi héroe';c.gender=document.querySelector('#charGender').value;c.skin=document.querySelector('#charSkin').value;c.hair=document.querySelector('#charHair').value;c.hairColor=document.querySelector('#charHairColor').value;save();render()}
function equip(id){let g=gear.find(x=>x.id===id);if(!g||!d.character.owned.includes(id))return;d.character.equipped[g.slot]=id;save();render()}
function buyGear(id){let g=gear.find(x=>x.id===id);if(!g||d.character.owned.includes(id)||level()<g.level||d.coins<g.cost)return;d.coins-=g.cost;d.character.owned.push(id);d.character.equipped[g.slot]=id;save();render()}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function go(p){page=p;render()}
function question(it){let [k,l,t,ph]=it,v=d.answers[k]??'';if(Array.isArray(t)){let a=Array.isArray(v)?v:[];return `<label>${l}</label><div class="options">${t.map(x=>`<label class="opt"><input type="checkbox" data-multi="${k}" value="${esc(x)}" ${a.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>`}if(t==='text')return `<label>${l}</label><textarea data-q="${k}" rows="2" placeholder="${esc(ph)}">${esc(v)}</textarea>`;return `<label>${l}</label><select data-q="${k}"><option value="">Elige…</option>${t.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function plan(){let a=d.answers,goals=a.goals||[],safe=a.pain!=='Dolor intenso o limitante'&&a.clearance!=='Sí, con restricciones';let days=(a.days||'3 días').startsWith('2')?'2':(a.days||'').startsWith('4')?'4':'3';let t=safe?`${days} sesiones por semana, de ${a.minutes||'20–30 min'}, en ${a.place||'casa'}. Empezar con movilidad cómoda, fuerza básica y actividad suave; aumentar poco a poco según tolerancia.`:'No iniciar una progresión de entrenamiento hasta consultar las restricciones o el dolor con un profesional sanitario.';if((a.avoid||[]).includes('Saltos/impacto')||(a.avoid||[]).includes('Correr'))t+=' Sin correr ni saltar.';let f=`Propuesta flexible de ${a.meals||'4'} comidas al día, ajustada a tus preferencias, presupuesto y horarios.`;if(a.intolerances)f+=` Tener en cuenta: ${a.intolerances}.`;if(a.triggers)f+=` Evitar o adaptar desencadenantes indicados: ${a.triggers}.`;let warnings=[];if(!safe)warnings.push('Has indicado dolor limitante o restricciones: pide orientación sanitaria antes de entrenar.');if(a.pain&&a.pain!=='No'&&a.pain!=='Dolor intenso o limitante')warnings.push('Mantén solo movimientos cómodos. Si el dolor aumenta, detén el ejercicio y solicita valoración.');if((a.conditions||[]).includes('Hernia de hiato/reflujo'))warnings.push('Con reflujo, evita entrenar justo después de comer y ajusta intensidad y posiciones según tolerancia.');return `<section class="card"><h2>Tu plan de partida</h2><h3>Entrenamiento</h3><p>${esc(t)}</p><h3>Alimentación</h3><p>${esc(f)}</p><h3>Rutinas y recuperación</h3><p>En días de trabajo largo, deja como opción descanso o una misión suave. Reserva las sesiones más completas para los días con más energía.</p><h3>Seguimiento</h3><p>${esc(a.review||'Revisión semanal')}: registra energía, sueño, molestias y constancia.</p>${warnings.map(x=>`<p class="warning">${esc(x)}</p>`).join('')}<p class="small">Es una orientación inicial automatizada, no un diagnóstico ni una prescripción médica o nutricional.</p></section>`}
function questionnaire(){let q=qs[step];return `<section class="card"><h2>Cuestionario de personalización</h2><p>${q[1]}</p><div class="progress"><span style="width:${(step+1)/qs.length*100}%"></span></div><p class="small">Bloque ${step+1} de ${qs.length}</p><h2>${q[0]}</h2>${q[2].map(question).join('')}<button class="secondary" onclick="step=Math.max(0,step-1);render()" ${step===0?'disabled':''}>Anterior</button><button class="primary" onclick="step=Math.min(qs.length-1,step+1);save();render()">${step===qs.length-1?'Terminar':'Siguiente'}</button><button class="secondary" onclick="go('Mi perfil')">Guardar y salir</button></section>`}
function home(){let day=Math.max(1,Math.min(66,Math.floor((Date.now()-new Date(d.start+'T00:00:00').getTime())/86400000)+1));return `<section class="card"><div class="row" style="display:flex;align-items:center;justify-content:space-between"><div class="big">DÍA ${day} / 66</div><button class="mini-char" onclick="go('Mi perfil')">${characterSmall()}</button></div><div class="progress"><span style="width:${day/66*100}%"></span></div><div class="grid"><div class="stat"><b>${d.xp}</b>XP</div><div class="stat"><b>${Math.floor(d.xp/100)+1}</b>Nivel</div><div class="stat"><b>${Object.values(d.done).filter(Boolean).length}</b>Misiones</div><div class="stat"><b>${d.coins}</b>Monedas</div></div><p>Tu objetivo no es hacerlo perfecto: es volver a intentarlo.</p><button class="primary" onclick="go('Cuestionario')">Personalizar mi plan</button></section>${plan()}`}
function missions(){let list=['Beber agua regularmente','Hacer movimiento adaptado','Preparar una comida equilibrada','Dedicar 5 minutos a ordenar/preparar algo','Reservar un momento de descanso'];return `<section class="card"><h2>Misiones de hoy</h2><p>Completa las que tengan sentido hoy; descansar también forma parte del proceso.</p>${list.map((x,i)=>{let k=new Date().toDateString()+i;return `<div class="mission"><input type="checkbox" ${d.done[k]?'checked':''} onchange="mission(${i},this.checked)"><span>${x}</span><b style="margin-left:auto;color:var(--violet)">+10 XP</b></div>`}).join('')}</section>`}
function turns(){return `<section class="card"><h2>Configuración de turnos</h2><label>Patrón</label><select id="pat">${['2 trabajados / 2 libres','3 trabajados / 3 libres','Días alternos','Manual/personalizado'].map(x=>`<option ${d.shift.pattern===x?'selected':''}>${x}</option>`).join('')}</select><label>Fecha de referencia</label><input type="date" id="sdate" value="${esc(d.shift.start)}"><label>Secuencia (T=trabajo, L=libre)</label><input id="seq" value="${esc(d.shift.sequence)}"><button class="primary" onclick="d.shift={pattern:document.querySelector('#pat').value,start:document.querySelector('#sdate').value,sequence:document.querySelector('#seq').value};save();alert('Turnos guardados')">Guardar</button><p class="small">Esta versión guarda tu patrón como referencia; no interpreta automáticamente PDF ni fotografías ni crea eventos desde cualquier calendario.</p></section>`}
function nutrition(){return `<section class="card"><h2>Nutrición</h2><p>Registro flexible: no necesitas contar calorías si no quieres.</p><label>Momento</label><input id="mealname" placeholder="Desayuno, comida…"><label>Qué has comido</label><textarea id="mealtext"></textarea><button class="primary" onclick="d.meals.push({n:document.querySelector('#mealname').value,t:document.querySelector('#mealtext').value});save();render()">Guardar</button><h3>Últimos registros</h3>${d.meals.slice(-8).reverse().map(x=>`<p>• ${esc(x.n)}: ${esc(x.t)}</p>`).join('')||'<p>Sin registros todavía.</p>'}<h3>Agua</h3><p>${d.water} vasos anotados hoy</p><button class="secondary" onclick="d.water++;save();render()">+ Un vaso</button></section>`}
function life(){return `<section class="card"><h2>Hábitos y vida</h2>${d.habits.map(x=>`<div class="mission"><input type="checkbox"><span>${esc(x)}</span></div>`).join('')}<label>Añadir hábito</label><input id="habit" placeholder="Ej. leer 10 minutos"><button class="primary" onclick="d.habits.push(document.querySelector('#habit').value);save();render()">Añadir</button></section>`}
function progress(){return `<section class="card"><h2>Progreso</h2><div class="grid"><div class="stat"><b>${d.xp}</b>XP</div><div class="stat"><b>${d.coins}</b>Monedas</div><div class="stat"><b>${Object.values(d.done).filter(Boolean).length}</b>Misiones</div><div class="stat"><b>${d.checkins.length}</b>Revisiones</div></div><label>¿Cómo te encuentras?</label><textarea id="note" placeholder="Energía, sueño, ánimo, molestias…"></textarea><button class="primary" onclick="d.checkins.push({date:new Date().toISOString(),text:document.querySelector('#note').value});save();render()">Guardar revisión</button>${d.checkins.slice(-5).reverse().map(x=>`<p>${new Date(x.date).toLocaleDateString('es-ES')}: ${esc(x.text)}</p>`).join('')}</section>`}
function settings(){return `<section class="card"><h2>Ajustes y copia de seguridad</h2><label>Inicio del reto</label><input id="start" type="date" value="${esc(d.start)}"><button class="primary" onclick="d.start=document.querySelector('#start').value;save();render()">Guardar</button><p>Exporta una copia periódicamente. Los datos se guardan en el almacenamiento local de este navegador.</p><button class="secondary" onclick="backup()">Exportar copia JSON</button><label>Restaurar copia JSON</label><input type="file" id="file" accept=".json,application/json"><button class="secondary" onclick="restore()">Importar copia</button><button class="secondary" onclick="if(confirm('¿Borrar los datos de Reformándome v3? Exporta antes una copia.')){localStorage.removeItem(KEY);location.reload()}">Borrar datos v3</button><p class="small">Esta versión utiliza una clave propia y no migra automáticamente los datos de versiones anteriores.</p></section>`}
function profile(){return `${characterProfile()}<section class="card"><h2>Mi plan y preferencias</h2><p>Completa el cuestionario por bloques. Puedes dejar preguntas en blanco y editar tus respuestas cuando quieras.</p><button class="primary" onclick="go('Cuestionario')">Abrir cuestionario</button></section>${plan()}`}
function render(){document.querySelector('#miniChar').innerHTML=characterSmall();document.querySelector('#nav').innerHTML=tabs.map(x=>`<button class="${x===page?'active':''}" onclick="go('${x}')">${x}</button>`).join('');let views={'Inicio':home,'Mi perfil':profile,'Cuestionario':questionnaire,'Misiones':missions,'Turnos':turns,'Nutrición':nutrition,'Entreno':()=>`<section class="card"><h2>Entrenamiento</h2><p>Tu propuesta actual se calcula a partir del cuestionario.</p></section>${plan()}`,'Vida':life,'Progreso':progress,'Ajustes':settings};document.querySelector('#app').innerHTML=views[page]()}
function mission(i,on){let k=new Date().toDateString()+i;d.done[k]=on;if(on){d.xp+=10;d.coins++}else{d.xp=Math.max(0,d.xp-10);d.coins=Math.max(0,d.coins-1)}save();render()}
function backup(){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='reformandome-copia.json';a.click();URL.revokeObjectURL(a.href)}
function restore(){let f=document.querySelector('#file').files[0];if(!f)return alert('Selecciona un archivo');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(confirm('La copia sustituirá los datos actuales de v3. ¿Continuar?')){d=Object.assign({},blank,x);save();render()}}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
document.addEventListener('input',e=>{if(e.target.dataset.q){d.answers[e.target.dataset.q]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.q){d.answers[e.target.dataset.q]=e.target.value;save()}if(e.target.dataset.multi){let k=e.target.dataset.multi,v=e.target.value,a=d.answers[k]||[];d.answers[k]=e.target.checked?[...new Set([...a,v])]:a.filter(x=>x!==v);save()}});
render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
